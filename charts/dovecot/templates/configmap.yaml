apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dovecot.fullname" . }}
  labels:
    {{- include "dovecot.labels" . | nindent 4 }}
data:
  99-k8s.conf: |
    # Generated by the dovecot Helm chart (Dovecot 2.4 syntax).
    hostname = {{ .Values.config.hostname }}

    mail_driver = {{ .Values.config.mailDriver }}
    mail_home = {{ .Values.config.mailHome }}
    mail_path = {{ .Values.config.mailPath }}

    {{- if .Values.tls.enabled }}

    ssl = required
    ssl_server_cert_file = {{ .Values.tls.mountPath }}/tls.crt
    ssl_server_key_file = {{ .Values.tls.mountPath }}/tls.key
    {{- end }}

    auth_mechanisms = plain login
    auth_allow_cleartext = no
    passdb_default_password_scheme = {{ .Values.config.passwordScheme }}

    # The passwd-file is reread by the auth process whenever its mtime changes.
    passdb passwd-file {
      passwd_file_path = {{ .Values.users.mountPath }}/{{ .Values.users.key }}
    }

    # The file only carries user:hash. Without a fields {} block Dovecot logs "User X is missing userdb info".
    userdb passwd-file {
      passwd_file_path = {{ .Values.users.mountPath }}/{{ .Values.users.key }}
      fields {
        uid:default = {{ .Values.config.vmailUser }}
        gid:default = {{ .Values.config.vmailUser }}
        home:default = {{ .Values.config.mailHome }}
      }
    }

    # kubectl logs
    log_path = /dev/stdout
    info_log_path = /dev/stdout
    debug_log_path = /dev/stdout
    {{- with .Values.logging }}
    {{- if .verboseProctitle }}
    verbose_proctitle = yes
    {{- end }}
    {{- if .mailDebug }}
    mail_debug = yes
    {{- end }}
    {{- if .authVerbose }}
    auth_verbose = yes
    {{- end }}
    {{- if .authDebug }}
    auth_debug = yes
    {{- end }}
    {{- range .logDebug }}
    log_debug = {{ . | quote }}
    {{- end }}
    {{- end }}

    # Login processes cannot chroot inside a container.
    service imap-login {
      chroot =
    }
    {{- with .Values.config.extra }}

    {{- . | nindent 4 }}
    {{- end }}
